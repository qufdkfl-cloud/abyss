<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=apple-mobile-web-app-capable content=yes><meta name=theme-color content="#0b0908"><title>심연의 횃불</title></head><body><title>심연의 횃불</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: persistent themed scene behind a single-column console; each place is one screen, details open as pages */
:root{
  --bg:#0b0908; --panel:rgba(20,16,13,.86); --panel2:rgba(34,27,21,.92); --line:#3e3126; --ink:#ece0c8; --muted:#a8977e;
  --brass:#d1a253; --blood:#a3302a; --good:#7fc06f; --stress:#ece6d8;
  --e-dark:#a38ae0; --e-fire:#e66c3c; --e-water:#4c9de3; --e-wind:#5fc493;
  --g0:#a39c90; --g1:#74c46a; --g2:#4fa0e6; --g3:#b583ec; --g4:#f2a53a; --g5:#ff4d6a; --g6:#ff5ab0;--g7:#ffe9a0;
  --display:'Nanum Myeongjo','Batang',serif; --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --light:62%; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:10px 24px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#scene .scn{position:absolute;inset:0;width:100%;height:100%}
#scene .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 72%;image-rendering:pixelated;animation:bgflick 2.6s ease-in-out infinite alternate}
@keyframes bgflick{0%{filter:brightness(.94)}40%{filter:brightness(1.03)}100%{filter:brightness(.97)}}
#scene .vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 65% at 50% 45%,transparent var(--light),rgba(0,0,0,.86) 100%)}
#scene.bossing::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 70% 40%,rgba(160,20,20,.28),transparent 70%);animation:bosspulse 2.4s ease-in-out infinite alternate}
@keyframes bosspulse{from{opacity:.5}to{opacity:1}}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
#app.withq{padding-right:50px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[data-a]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.center{text-align:center}.sm{font-size:12px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:11px 12px;font-weight:700;text-align:center;backdrop-filter:blur(2px)}
.btn.main{background:linear-gradient(#45180f,#2a0e09);border-color:var(--blood);color:#f6e6ca}
.btn.gold{border-color:var(--brass);color:var(--brass)}.btn.on{border-color:var(--good);color:var(--good)}
.btn:disabled{opacity:.36;cursor:default}
.btn small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1 1 130px}
.acts{display:flex;gap:6px}.acts .btn{flex:1 1 0;padding:9px 6px;font-size:13px;min-width:0}
.acts.sm .btn{font-size:12px;padding:7px 4px}
.eb{display:inline-grid;place-items:center;min-width:20px;height:19px;padding:0 5px;border-radius:10px;font-size:11px;font-weight:700;color:#0b0908;line-height:1;vertical-align:middle}
.ic{width:100%;height:100%;display:block}
.label{font-size:11px;letter-spacing:.1em;color:var(--muted)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:9px;line-height:17px;vertical-align:middle}
.pill.aff{background:#5a1a16;color:#ffb3a8}.pill.vir{background:#4a3a12;color:#ffd77a}.pill.dd{background:#3b0d0b;color:#ff8a7a}
.pill.lt{background:#4a4220;color:#ffe58a}.pill.dk{background:#3a1430;color:#ff8ad0}.pill.nt{background:#2a241e;color:var(--muted)}
.pw{font-size:12px;color:var(--brass);font-weight:700}.qp{color:var(--good)}.qn{color:#e4877e}.up{color:var(--good);font-weight:700}.dn{color:#e4877e;font-weight:700}
.autob{font-size:12px;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-weight:700;color:var(--muted)}.autob.on{border-color:var(--good);color:var(--good)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:8px}
.lore{font-family:var(--display);font-style:italic;color:#e3cfa6;margin:0}
.dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--g5);box-shadow:0 0 6px var(--g5)}

/* hud */
.hud{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;align-items:baseline;gap:8px}.hud h2{font-size:19px}.sub{font-family:var(--body);font-size:12.5px;font-weight:500;color:var(--muted)}
.gold{margin-left:auto;font-size:13px}.gold b{color:var(--brass)}
.torch{display:flex;align-items:center;gap:7px;font-size:11px}
.torch .bar{flex:1;height:7px;background:#000;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.torch .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blood),var(--brass));transition:width .6s}
.flame{width:12px;height:16px;animation:flick 1.6s infinite alternate}
@keyframes flick{0%{opacity:.7;transform:scale(.94)}100%{opacity:1;transform:scale(1.06)}}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.menu button{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 2px;font-size:12px;font-weight:700}
.menu b{color:var(--brass);font-weight:700}
.phead{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.phead h2{font-size:18px}.backb{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-weight:700;white-space:nowrap}

/* title */
.title{text-align:center;padding:26px 0 4px}.title h1{font-size:42px;letter-spacing:.04em;text-shadow:0 0 28px rgba(209,162,83,.45)}.title p{margin:6px 0 0;color:var(--muted);font-family:var(--display);font-style:italic}
.lineup{display:flex;justify-content:center;align-items:flex-end;gap:4px;padding:6px 0}.lineup .art{width:84px}.lineup.sm{gap:6px;padding:0}.lineup.sm .art{width:40px}
.menu-col{display:flex;flex-direction:column;gap:8px}
.setup{display:grid;gap:10px}.scard{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:6px}
.scard h3{font-size:16px}.elbtn{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:7px 9px;font-size:12px;display:flex;align-items:center;justify-content:space-between}
.help p{margin:0 0 8px;color:var(--ink)}.help b{color:var(--brass)}

/* dungeon */
.path{display:flex;gap:5px;justify-content:center;align-items:center}
.path i{width:12px;height:12px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.5)}
.path i.d{background:#6b5a48}.path i.c{background:var(--brass);box-shadow:0 0 8px var(--brass)}.path i.b{border-color:var(--blood);width:16px;height:16px}
.toast{background:rgba(0,0,0,.55);border-left:2px solid var(--brass);padding:6px 10px;font-family:var(--display);font-style:italic;color:#ecd6aa;font-size:13px}
.doors{display:grid;gap:10px}.doors.n2{grid-template-columns:1fr 1fr}.doors.n3{grid-template-columns:1fr 1fr 1fr}.doors.n1{grid-template-columns:minmax(0,220px);justify-content:center}
.door{position:relative;background:linear-gradient(#3a2c20,#1a120c);border:2px solid #5a4632;border-radius:50% 50% 6px 6px/26% 26% 6px 6px;padding:20px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;min-height:176px;justify-content:flex-end;box-shadow:inset 0 0 0 4px rgba(0,0,0,.35)}
.door::before{content:"";position:absolute;inset:12px 18% auto;height:48%;border-radius:50% 50% 0 0/40% 40% 0 0;background:radial-gradient(ellipse at 50% 80%,rgba(209,162,83,.12),#050303 70%);box-shadow:inset 0 0 18px #000}
.door>*{position:relative}.door .art{width:38px;height:38px;color:#6b5a48}.door b{font-family:var(--display);font-size:16px}
.door span{font-size:11px;color:var(--muted);line-height:1.3;word-break:keep-all;font-style:italic}
.door .dk{position:absolute;top:2px;left:0;right:0;font-style:normal;font-size:10px;letter-spacing:.1em}
.door.scout .art{color:var(--brass)}.door.boss{border-color:var(--blood);animation:bossdoor 1.8s infinite alternate}.door.boss .art{color:#ff7a6a}
@keyframes bossdoor{to{box-shadow:0 0 18px rgba(200,30,30,.55),inset 0 0 0 4px rgba(0,0,0,.35)}}
.door:hover,.door:focus-visible{border-color:var(--brass)}
.door:active{transform:scale(.97)}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 4px 6px;display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:0;text-align:center}
.tile .art{width:96%;margin:-6px auto 0}.tile .tn{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile .tt{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .rk{position:absolute;top:2px;left:6px;font-size:10px;color:var(--muted)}.tile .tflag{font-size:10px;color:#ff8a7a;font-weight:700}
.tile.empty{display:grid;place-items:center;color:var(--muted);font-size:11px;border-style:dashed;min-height:120px}
.tile.ddt{border-color:var(--blood)}
.hp{height:5px;background:#000;border-radius:3px;overflow:hidden;margin-top:2px}.hp i{display:block;height:100%;background:#b8322b;transition:width .4s}.hp.ok i{background:var(--good)}
.sb{height:3px;background:#000;border-radius:2px;overflow:hidden;margin-top:1px}.sb i{display:block;height:100%;background:var(--stress);transition:width .4s}.sb.hi i{background:#ff9b8a}

/* hero page */
.herohead{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px}
.herohead .art{width:100%}.hh{display:flex;flex-direction:column;gap:5px;min-width:0}.pills{display:flex;gap:4px;flex-wrap:wrap}
.stagepips{display:flex;gap:3px}.stagepips i{flex:1;height:6px;border-radius:2px;background:#2a221b}.stagepips i.f{background:var(--brass)}.stagepips i.m{outline:1px solid #6b5a48}
.alibar{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}.alibar div{position:relative;flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,#8a1a3a,#3a3028,#c9a84a)}
.alibar i{position:absolute;top:-3px;width:4px;height:12px;margin-left:-2px;background:#fff;border-radius:2px}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stats4 span{font-size:11px;color:var(--muted);display:flex;flex-direction:column}.stats4 b{font-size:14px;color:var(--ink)}
.slots{display:grid;gap:6px}.slot{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gc,var(--line));border-radius:6px;padding:7px 10px;text-align:left;display:flex;flex-direction:column;gap:1px}
.slot b{color:var(--gc)}.skrow{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid rgba(62,49,38,.5)}
.list{display:grid;gap:6px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.tabs button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px;font-size:12px;font-weight:700}.tabs .on{border-color:var(--brass);color:var(--brass)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.btile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.btile .art{width:28px;height:28px;color:var(--brass)}.btile b{font-size:12px;word-break:keep-all;line-height:1.25}.btile span{font-size:10px;color:var(--muted);line-height:1.25}
.grave{font-size:12px;color:var(--muted);display:grid;gap:2px}.bignum{font-family:var(--display);font-size:44px;font-weight:800}

/* battle */
.narr{font-family:var(--display);font-style:italic;color:#f0d8a8;text-align:center;min-height:22px;font-size:15px;text-shadow:0 1px 6px #000}
.narr.fresh{animation:nin .7s}@keyframes nin{from{opacity:0;letter-spacing:.2em}to{opacity:1}}
.stage{position:relative;display:flex;align-items:flex-end;gap:8px;padding:22px 4px 14px;border-radius:9px;border:1px solid rgba(62,49,38,.7);background:linear-gradient(transparent 60%,rgba(0,0,0,.45));min-height:170px}
.stage::after{content:"";position:absolute;left:4%;right:4%;bottom:12px;height:8px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(3px);z-index:0}
.sideh,.sidee{display:flex;gap:2px;align-items:flex-end;min-width:0}.sideh{flex:1.45}.sidee{flex:1}
.u{position:relative;flex:1 1 0;min-width:0;max-width:78px;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:3px 1px;border-radius:6px;border:1px solid transparent;cursor:pointer;z-index:1}
.u.big{flex-grow:1.6;max-width:104px}.u .art{width:100%}.u.e .art .pxi{transform:scaleX(-1)}
.u .rk{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
.u .ed{position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;z-index:2}
.u .mini{font-size:9px;line-height:11px;text-align:center;color:var(--muted);min-height:11px;white-space:nowrap;overflow:hidden}
.u.act{border-color:var(--brass);background:rgba(209,162,83,.1)}.u.eact{border-color:var(--blood);background:rgba(163,48,42,.12)}.u.insp{border-color:#6b5a48}
.u.pick{border-color:var(--ink);animation:pulse .9s infinite alternate}@keyframes pulse{to{box-shadow:0 0 12px rgba(236,224,200,.45)}}
.u.dead{opacity:.15}.u.dd .art{filter:drop-shadow(0 0 6px #c0302a)}
.u .tag{position:absolute;top:-2px;left:0;right:0;text-align:center;font-size:9px;font-weight:800;z-index:2}.tag.weak{color:var(--good)}.tag.res{color:#888}
.info{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;min-height:48px}
.log{background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px;min-height:42px}
.log div{color:var(--muted)}.log div:first-child{color:var(--ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:6px}
.panel .who{font-family:var(--display);font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.panel .who .autob{margin-left:auto}.panel .who .autob+.autob{margin-left:0}.wsub{font-size:12px;font-family:var(--body);font-weight:500}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.sk{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 7px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0}
.sk b{font-size:13px;display:flex;justify-content:space-between;gap:4px;align-items:center}.sk>span{font-size:10.5px;color:var(--muted);line-height:1.3}
.sk.on{border-color:var(--brass);background:#2a2015}.sk:disabled{opacity:.33}.sk .cd{color:#e4877e}
.pos{display:inline-flex;gap:2px;align-items:center;font-size:0}.pos i{width:6px;height:6px;border-radius:50%;background:#3a3027}
.pos i.y{background:var(--brass)}.pos i.t{background:#c0534a}.pos i.me{outline:1px solid var(--ink)}.pos .sep{width:5px}
.hint{font-size:12px;color:var(--brass)}

/* pixel art */
.px{position:relative}.pxi{scale:var(--tsc,1);transform-origin:50% 100%}.pxi{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.idle .pxi{}.hover .pxi{animation:hov 1.6s ease-in-out infinite}
@keyframes bob{50%{translate:0 -1.5%}}@keyframes hov{50%{translate:0 -6%}}
.gl-ring .pxi{filter:drop-shadow(0 0 2px var(--glc)) drop-shadow(0 0 5px var(--glc))}
.gl-set .pxi{animation:setpulse 1.8s ease-in-out infinite alternate,bob 2.4s ease-in-out infinite}
@keyframes setpulse{from{filter:drop-shadow(0 0 2px var(--glc))}to{filter:drop-shadow(0 0 7px var(--glc)) drop-shadow(0 0 12px var(--glc))}}
.gl-uq .pxi{animation:uqshine 1.2s linear infinite,bob 2.4s ease-in-out infinite}
@keyframes uqshine{0%,100%{filter:drop-shadow(0 0 3px #ff4d6a) drop-shadow(0 0 8px #ffd76a) brightness(1)}50%{filter:drop-shadow(0 0 7px #ff4d6a) drop-shadow(0 0 16px #ffe9a8) brightness(1.3)}}
.gl-fallen .pxi{filter:drop-shadow(0 0 3px #a0103a) drop-shadow(0 0 9px #40005a)}.gl-saint .pxi{filter:drop-shadow(0 0 3px #ffe58a) drop-shadow(0 0 10px #fff2c0)}
.gl-mon .pxi{filter:drop-shadow(0 0 5px #ff2a2a)}
.spk{position:absolute;width:4px;height:4px;background:#fff;box-shadow:0 0 6px #fff,0 0 10px var(--glc,#ffd76a);transform:rotate(45deg);animation:spk 1.4s infinite;top:12%;left:14%;pointer-events:none}
.spk.s2{top:40%;left:82%;animation-delay:.45s}.spk.s3{top:76%;left:24%;animation-delay:.9s}
@keyframes spk{0%,55%,100%{opacity:0;scale:.3}70%{opacity:1;scale:1}85%{opacity:.4}}
.uq{animation:uqglow 1.6s infinite alternate}@keyframes uqglow{from{box-shadow:0 0 6px var(--g5)}to{box-shadow:0 0 22px var(--g5)}}

/* scene particles + bats */
.pt{position:absolute;width:3px;height:3px;border-radius:50%;animation:drift 6s linear infinite}
.pt.fog{width:120px;height:40px;background:radial-gradient(rgba(140,120,170,.12),transparent 70%);animation:fog 14s linear infinite}
.pt.fly{background:#d8ff7a;box-shadow:0 0 6px #b8ff4a;animation:firefly 5s ease-in-out infinite}
.pt.bub{border:1px solid rgba(140,200,255,.6);width:5px;height:5px;animation:bubble 6s linear infinite}
.pt.emb{background:#ff6a2a;box-shadow:0 0 5px #ff3a1a;animation:ember 5s linear infinite}
.pt.emb2{background:#ffb04a;box-shadow:0 0 5px #ff8a2a;animation:ember 4s linear infinite;opacity:.7}
.pt.spk{position:absolute}
@keyframes drift{to{transform:translateY(-40px)}}
@keyframes fog{0%{transform:translateX(-60px);opacity:0}30%,70%{opacity:1}100%{transform:translateX(80px);opacity:0}}
@keyframes firefly{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(14px,-18px);opacity:1}}
@keyframes bubble{0%{transform:translateY(40px);opacity:0}20%{opacity:.8}100%{transform:translateY(-120px);opacity:0}}
@keyframes ember{0%{transform:translateY(30px);opacity:0}20%{opacity:1}100%{transform:translate(12px,-140px);opacity:0}}
.cand{animation:flick 1.2s infinite alternate}.fire{animation:flick .5s infinite alternate}.rip{animation:rip 3s ease-in-out infinite}
@keyframes rip{50%{transform:translateX(14px);opacity:.15}}
.drip{animation:drip 3.2s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(120px);opacity:0}}
.crys{animation:crys 3s ease-in-out infinite}@keyframes crys{50%{opacity:.75}}
.batfly{position:absolute;left:0;width:30px;animation:batpath 12s linear infinite}
.batfly .flap{position:relative;width:30px;height:24px}.batfly .pxi{position:absolute;inset:0;width:30px}
.batfly .pxi:nth-child(2){animation:flapb .28s steps(1) infinite}.batfly .pxi:nth-child(1){animation:flapa .28s steps(1) infinite}
@keyframes flapa{0%{opacity:1}50%{opacity:0}}@keyframes flapb{0%{opacity:0}50%{opacity:1}}
@keyframes batpath{0%{transform:translate(-40px,0)}25%{transform:translate(28vw,-30px)}50%{transform:translate(55vw,20px)}75%{transform:translate(80vw,-20px)}100%{transform:translate(110vw,10px)}}

/* floats */

const un=u=>isH(u)?u.nm:u.n;
function freeName(){const used=new Set(S.heroes.map(h=>h.nm).concat(S.grave.map(g=>g.nm)));const f=NAMES.filter(n=>!used.has(n));return f.length?pick(f):pick(NAMES)+' '+R(2,9)}
function baseOf(h){return h.boss?BOSSCLS[h.boss]:h.cls==='villain'?VILLAIN:CLASSES[h.cls]}
function recalc(h,full){const c=baseOf(h);const ratio=h.maxhp?h.hp/h.maxhp:1;const b=h.bon||{};
  const m=(1+0.1*(h.lv-1))*(h.talent||1)*(h.boss?1.6:h.cls==='villain'?1.15:1)*(1+0.09*(h.tier||0));
  const eq=Object.values(h.eq||{}).filter(Boolean);const sum=k=>eq.reduce((a,i)=>a+(i.st[k]||0),0);const sc=setCount(h);
  const sb=k=>sc.two.reduce((a,s)=>a+(SETS[s].b2[k]||0),0);
  h.maxhp=Math.round((c.base.hp*m*(1+(b.hp||0))+sum('hp'))*(1+qv(h,'hpMul')+sb('hp')));
  h.atk=Math.round(c.base.atk*m*(1+(b.atk||0))+sum('atk'));h.mag=Math.round(c.base.mag*m*(1+(b.mag||0))+sum('mag'));
  h.def=Math.round((c.base.def*m*(1+(b.def||0))+sum('def'))*(1+sb('def')));
  h.spd=c.base.spd+Math.floor((h.tier||0)/2)+(b.spd||0)+sum('spd')+qv(h,'spd')+(h.boss?2:0);
  h.crit=sum('crit')+(b.crit||0)+sb('crit');h.ls=sum('ls')+(b.ls||0)+sb('ls');h.fx=eq.map(i=>i.fx).filter(Boolean);h.xs={};XS.forEach(k=>h.xs[k]=sum(k));if(sc.full)h.fx.push(sc.full+'set');
  if(full)h.hp=h.maxhp;else if(h.hp>0)h.hp=Math.max(1,Math.round(h.maxhp*ratio))}
const power=h=>Math.round((h.atk*1.2+h.mag*1.2+h.def*2+h.maxhp*0.3+h.spd*2)*(1+(h.crit||0)));
function rollQuirks(np,nn){const q=[];const P=[...QPOS.keys()],N=[...QNEG.keys()];for(let i=0;i<np;i++)q.push('p'+P.splice(R(0,P.length-1),1)[0]);for(let i=0;i<nn;i++)q.push('n'+N.splice(R(0,N.length-1),1)[0]);return q}
function shell(cls,el,lv,rar){const r=RAR[rar];return {uid:mkid(),nm:freeName(),cls,el:el||pick(EL_ORDER),lv:lv||1,xp:0,tier:0,ali:0,fate:null,bon:{},talent:r.t,rar,boss:null,
  stress:0,aff:null,vir:null,q:rollQuirks(r.q[0],r.q[1]),st:{},cds:{},skills:[],hp:0,maxhp:0,fx:[],eq:{w:null,a:null,r:null}}}
function newHero(cls,el,lv,rar){const h=shell(cls,el,lv,rar==null?1:rar);h.skills=CLASSES[cls].skills.slice();recalc(h,true);return h}

function rollRecruit(w){const rar=rollGrade(w||RAR.map(r=>r.p));const r=RAR[rar];const h=newHero(pick(CLS_ORDER),null,Math.max(1,Math.round(avgLv())+r.lv),rar);
  if(r.gift===3){const u=makePrimal();h.eq[u.slot]=u;recalc(h,true)}else if(r.gift){h.eq.w=lootItem([0,0,0,40,60],'w',h.cls);recalc(h,true)}return h}
function queueEvo(h){if(h.dead)return;if(h.tier<9&&h.lv>=EVO_LV[h.tier]&&!S.evoQ.includes(h.uid))S.evoQ.push(h.uid)}
function evoChoices(h){const o=(h&&h.cls==='villain'?MON_EVO:EVO_OPTS).slice();if(Math.random()<0.15)o.push(pick(EVO_RARE));return o}
function applyEvo(h,opt){const b=h.bon=h.bon||{};if(opt.tr){h.tr=h.tr||[];if(!h.tr.includes(opt.tr))h.tr.push(opt.tr)}for(const k in opt.bon)b[k]=(b[k]||0)+opt.bon[k];
  if(opt.calm)h.ali=Math.round(h.ali*0.7);else h.ali=clamp(h.ali+opt.ali,-100,100);if(opt.stress)h.stress=clamp(h.stress+opt.stress,0,199);
  h.tier++;let learned=null;if(h.tier===3||h.tier===6||h.tier===9){const side=h.ali>=0?'light':'dark';const sk=h.cls==='villain'?['vrend','vroar','vapex'][h.tier/3-1]:EVO_SK[h.cls][side][h.tier/3-1];
    if(!h.skills.includes(sk)){h.skills.push(sk);learned=sk}}
  recalc(h);if(h.hp>0)h.hp=h.maxhp;
  if(!h.fate&&h.tier>=6&&h.cls!=='villain'){if(h.ali<=-90)S.fateQ.push({uid:h.uid,k:Math.random()<0.3?'betray':'fallen'});else if(h.ali>=90)S.fateQ.push({uid:h.uid,k:Math.random()<0.15?'leave':'saint'})}
  queueEvo(h);return learned}

/* ---------- items ---------- */
function rollGrade(w){const t=w.reduce((a,b)=>a+b,0);let r=Math.random()*t;for(let i=0;i<w.length;i++){if((r-=w[i])<0)return i}return 0}
function makeItem(g,slot,cls,f){f=f||S.floor;slot=slot||pick(['w','w','a','r']);if(slot==='w')cls=cls||pick(CLS_ORDER);
  const p=(2.5+f*0.9)*GMUL[g];const st={};let n;
  if(slot==='w'){n=WNAMES[cls][g];st[cls==='mage'||cls==='healer'?'mag':'atk']=Math.round(p);if(cls==='healer')st.hp=Math.round(p*0.8)}
  else if(slot==='a'){n=ANAMES[g];st.def=Math.max(1,Math.round(p*0.3));st.hp=Math.round(p*2.2)}
  else{n=RNAMES[g];st.hp=Math.round(p*1.1);st.atk=st.mag=Math.max(1,Math.round(p*0.35));if(g>=2)st.spd=1}
  const pool=['crit','ls','hp'];const aff=g>=4?2:g>=2?1:0;const av=[0,0,0.06,0.09,0.13][g];
  for(let k=0;k<aff;k++){const a=pool.splice(R(0,pool.length-1),1)[0];if(a==='hp')st.hp=(st.hp||0)+Math.round(p*1.2);else st[a]=av}
  return {id:Date.now()+Math.random(),slot,cls:slot==='w'?cls:null,g,n,f,st,val:Math.round([3,8,18,40,90][g]*(1+(f-1)*0.15))}}
function makeSetItem(slot){const k=pick(Object.keys(SETS));slot=slot||pick(['w','a','r']);const f=S.floor;const p=(2.5+f*0.9)*3.7;const st={};
  if(slot==='w'){st.atk=Math.round(p*0.8);st.mag=Math.round(p*0.8)}else if(slot==='a'){st.def=Math.round(p*0.3);st.hp=Math.round(p*2.4)}else{st.hp=Math.round(p*1.2);st.atk=st.mag=Math.round(p*0.4)}
  return {id:Date.now()+Math.random(),slot,cls:null,g:4,set:k,n:SETS[k].names[{w:0,a:1,r:2}[slot]],f,st,val:Math.round(120*(1+(f-1)*0.15))}}
function lootItem(w,slot,cls){const g=rollGrade(w);if(g===4&&Math.random()<0.3)return makeSetItem(slot);return makeItem(g,slot,cls)}
function makeUnique(){const u=pick(UNIQUES);const f=S.floor;const p=(2.5+f*0.9)*4.5;const st={};
  for(const k in u.st)st[k]=(k==='crit'||k==='ls')?u.st[k]:Math.max(1,Math.round(p*u.st[k]));
  return {id:Date.now()+Math.random(),slot:u.slot,cls:null,g:5,n:u.n,f,st,fx:u.fx||null,fxd:u.d,val:Math.round(200*(1+(f-1)*0.15))}}
function statText(st){const L={atk:'공격',mag:'마력',def:'방어',hp:'체력',spd:'속도'};const o=[];for(const k in L)if(st[k])o.push(`${L[k]}+${st[k]}`);
  if(st.crit)o.push(`치명타+${Math.round(st.crit*100)}%`);if(st.ls)o.push(`흡혈 ${Math.round(st.ls*100)}%`);return o.join(' · ')}
const icol=it=>it.set?SETS[it.set].c:GR[it.g].c;
const glabel=it=>it.set?'세트':GR[it.g].n;
const itemTag=it=>`<span style="color:${icol(it)};font-weight:700">[${glabel(it)}] ${it.n}</span>`;
const canEquip=(it,h)=>it.slot!=='w'||!it.cls||!!h.boss||h.cls==='villain'||it.cls===h.cls;
function bestHolder(it){let best=null,gain=0;(S.heroes||[]).filter(h=>!h.dead).forEach(h=>{if(!canEquip(it,h))return;const tmp=JSON.parse(JSON.stringify(h));tmp.eq[it.slot]=it;recalc(tmp);const g=power(tmp)-power(h);if(g>gain){gain=g;best=h}});return best}
function autoEquip(it,lines){const h=bestHolder(it);if(!h)return false;const old=h.eq[it.slot];h.eq[it.slot]=it;recalc(h);lines&&lines.push(`${itemTag(it)} 획득 → <b>${h.nm}</b> 자동 장착`);if(old)addItem(old);return true}
function addItem(it,lines){if(autoEquip(it,lines))return true;if(S.inv.length>=INV_MAX){S.gold+=it.val;lines&&lines.push(`가방이 가득 차 ${itemTag(it)}을 ${it.val}금화에 팔았다`);return false}
  S.inv.push(it);lines&&lines.push(`${itemTag(it)} 획득`);return true}
function addBook(i,lines,n){n=n||1;S.books[i]+=n;lines&&lines.push(`<span style="color:var(--brass);font-weight:700">${BOOKS[i].n}</span> ${n}권 (${S.books[i]}/4)`)}
function addScroll(k,lines,n){n=n||1;k=k||pick(SCROLL_KEYS);S.scrolls[k]=(S.scrolls[k]||0)+n;lines&&lines.push(`${SCROLLS[k].e} ${SCROLLS[k].n}${n>1?' '+n+'장':''} 획득`)}

/* ---------- stress & death ---------- */
function narr(k,txt){const B=S.battle;if(!B)return;B.narr=txt||pick(NARR[k]);B.narrFresh=true}
function float(u,text,kind,sub){FLOATS.push({uid:u.uid,text,kind,sub})}
function log(m){const B=S.battle;if(!B)return;B.log.unshift(m);B.log.length=Math.min(B.log.length,3)}
function pend(t){S.pending=(S.pending||[]).concat(t)}
function addStress(h,v,silent){if(!h||h.dead||!v)return;
  if(v>0){if(h.fx&&h.fx.includes('calm'))return;v*=1+qv(h,'stressMul');v*=1-Math.min(.5,synv('sres'));if(rule('calm'))v*=0.5;if(bt(h,'shell'))v*=0.5;if(tr(h,'madness'))v*=2;if(h.race==='demon')v*=1.2;if(h.race==='undead')v*=0.7;if(h.xs&&h.xs.sres)v*=1-Math.min(.6,h.xs.sres);if(h.vir&&h.vir.k==='courage')v*=0.5}
  v=Math.round(v);if(!v)return;const prev=h.stress;h.stress=clamp(h.stress+v,0,200);if(!silent)float(h,(v>0?'+':'')+v+' 스트레스',v>0?'st':'rl');
  if(h.stress>=200){h.stress=150;log(`${h.nm}의 심장이 멎었다!`);narr('heart');if(h.hp>0){h.hp=0;enterDD(h)}else die(h);if(!S.battle)pend(`${h.nm}의 심장이 멎었다!`);return}
  if(prev<100&&h.stress>=100&&!h.aff&&!h.vir){
    if(Math.random()<0.25){h.vir=pick(VIR);h.stress=50;h.ali=clamp(h.ali+8,-100,100);narr('vir');float(h,h.vir.n+'!','crit');log(`${h.nm}: 시련 속에서 ${h.vir.n}`);if(!S.battle)pend(`<b style="color:#ffd77a">${h.nm}</b>이 시련을 이겨내고 <b>${h.vir.n}</b>을 얻었다!`)}
    else{h.aff=pick(AFF);h.ali=clamp(h.ali-8,-100,100);narr('aff');float(h,h.aff.n+'!','big');log(`${h.nm}: ${h.aff.n}에 빠졌다`);live().forEach(o=>{if(o!==h)addStress(o,6,true)});if(!S.battle)pend(`<b style="color:#ff8a7a">${h.nm}</b>의 정신이 무너졌다: <b>${h.aff.n}</b>`)}}}
function enterDD(h){h.dd=true;float(h,'죽음의 문턱','big');log(`${h.nm}이 죽음의 문턱에 섰다`);narr('dd');live().forEach(o=>{if(o!==h)addStress(o,6,true)})}
function deathRoll(h){if(tr(h,'immortal')&&(h.st.imm||0)<3){h.st.imm=(h.st.imm||0)+1;float(h,'불멸 '+h.st.imm+'/3','sh');addStress(h,12,true);return false}const keep=0.67+(anyBt('undying')?0.15:0)+qv(h,'dbr')+(h.xs&&h.xs.dbr||0)+(h.vir?0.1:0)+(h.fx&&h.fx.includes('lichset')?0.4:0);if(Math.random()<keep){float(h,'버텨냈다','sh');narr('survive');return false}die(h);return true}
function die(h){if(h.dead)return;if(mu('revive')&&(S.guardUsed||0)<mu('revive')&&S.heroes.includes(h)){S.guardUsed=(S.guardUsed||0)+1;h.hp=Math.round(h.maxhp*0.5);h.dd=false;float(h,'수호 영혼!','crit');log(`수호 영혼이 ${h.nm}을 지켰다!`);try{fxHit(h.uid,'pillar','#9ae8ff',0)}catch(e){}return}const mart=tr(h,'martyr');h.dead=true;h.hp=0;if(mart)setTimeout(()=>{live().forEach(o=>{o.hp=o.maxhp;o.dd=false;o.stress=0;float(o,'순교의 은총','heal')});log(`${h.nm}의 순교로 모두가 일어섰다`);render()},10);float(h,'사망','big');log(`${h.nm}(${hname(h)}) 사망`);narr('death');
  S.grave.push({nm:h.nm,t:hname(h),lv:h.lv,f:S.floor});live().forEach(o=>addStress(o,18,!S.battle))}
function bury(){const dead=S.heroes.filter(h=>h.dead);if(!dead.length)return;
  dead.forEach(h=>Object.values(h.eq).forEach(it=>{if(it&&S.inv.length<INV_MAX)S.inv.push(it)}));
  S.heroes=S.heroes.filter(h=>!h.dead);S.evoQ=S.evoQ.filter(u=>S.heroes.some(h=>h.uid===u))}
function healHero(t,v){if(t.dead)return 0;if(tr(t,'vamp'))v*=0.5;if(t.race==='undead')v*=0.7;if(t.aff&&t.aff.k==='paranoid'&&Math.random()<0.5){float(t,'거부','dot');log(`${t.nm}이 치료를 거부했다`);return 0}
  v=Math.round(v*(1+qv(t,'healMul')+synv('heal')));t.hp=Math.min(t.maxhp,t.hp+v);if(t.hp>0)t.dd=false;float(t,'+'+v,'heal');return v}
function hurtOut(h,frac){if(h.hp>0)h.hp=Math.max(1,h.hp-Math.round(h.maxhp*frac))}
const rh=()=>pick(live());

/* ---------- map: forward-only crossroads ---------- */
function rollRoom(){return ['battle','treasure','curio','empty','merchant','prisoner','forge','shrine','gamble','bounty','quest'][rollGrade([32,10,14,5,6,7,6,5,5,6,9])]}
function genFloor(){const n=S.floor%FINAL===0?R(3,4):R(6,8);const layers=[];for(let i=0;i<n;i++){const k=Math.random()<0.55?2:3;const L=[];for(let j=0;j<k;j++)L.push({t:rollRoom(),scout:false,amb:pick(AMB)});layers.push(L)}
  layers.push([{t:'boss',scout:true,amb:'짙은 피 냄새와 거대한 숨소리'}]);S.map={layers,step:0,path:[],theme:themeIdx(S.floor)};S.torch=100;S.hall='';
  {const th=THEMES[S.map.theme];const n=Math.min(th.bosses.length,2+Math.floor((S.floor-1)/5));S.map.boss=S.floor===1||th.bosses.length===1?th.bosses[0]:pick(th.bosses.slice(0,n))}const b=curBoss();S.map.bel=b.randEl?pick(EL_ORDER):b.el;S.map.gim=S.floor>=2?pick(Object.keys(GIM)):null;S.map.rule=S.floor>=2&&Math.random()<0.75?pick(Object.keys(RULES)):null;scoutCheck()}
function scoutCheck(){const L=S.map&&S.map.layers[S.map.step];if(!L)return;const c=rule('fog')?0:[0,0.05,0.2,0.45][lightLv()];L.forEach(n=>{if(!n.scout&&Math.random()<c)n.scout=true})}
const theme=()=>THEMES[S.map?S.map.theme:0];
function advance(){S.map.step++;scoutCheck()}
function chooseDoor(i){const n=S.map.layers[S.map.step][i];if(!n)return;S.hall='';S.map.path[S.map.step]=i;S.torch=Math.max(0,S.torch-13*(pact('dark')?2:1));
  const dark=S.torch<30;const r=Math.random();
  if(n.t!=='boss'&&r<0.1*[2.2,1.5,1,0][lightLv()]*(rule('fog')?2:1)){S.pendRoom=i;startBattle(makeEnemies(),'normal');log('복도에서 기습당했다!');return}
  if(n.t!=='boss'){if(r<0.2){const h=rh();hurtOut(h,0.1);addStress(h,8,true);S.hall=`복도의 함정! ${h.nm} 체력 -10%, 스트레스 +8`}
  else if(r<0.28){const g=R(4,10)*S.floor;S.gold+=g;S.hall=`복도에서 금화 ${g}개를 주웠다`}
  else if(r<0.33){addScroll(null);S.hall='복도에서 낡은 두루마리를 주웠다'}
  else if(r<0.4){live().forEach(h=>addStress(h,4,true));S.hall='어둠 속에서 무언가 지켜본다… 전원 스트레스 +4'}}
  enterNode(n)}
function enterNode(n){const t=n.t;n.vis=true;
  live().forEach(h=>{const v=[7,3,1,0][lightLv()]+qv(h,'roomStress');if(v)addStress(h,v,true)});
  if(t!=='boss'){const mc=(0.04+[0.1,0.04,0,0][lightLv()]+S.floor*0.004)*(rule('abyss')?3:1)+(t==='curio'?0.05:0);if(Math.random()<mc){startBattle(makeMonster(),'monster');return}}
  if(t==='battle'){if(rule('cursed')||Math.random()<(pact('elite')?0.5:0.15))startBattle(makeElite(),'elite');else startBattle(makeEnemies(),'normal');return}
  if(t==='boss'){startBattle(makeBoss(),'boss');return}
  if(t==='treasure')S.modal={type:'curio',cid:'chest'};
  else if(t==='curio')S.modal={type:'curio',cid:pick(['bones','altar','mirror','shelf','fountain','corpse','chest','well'])};
  else if(t==='merchant')S.modal={type:'merchant',stock:genStock()};
  else if(t==='prisoner')S.modal={type:'prisoner',p:genPrisoner()};
  else if(t==='quest')S.modal={type:'curio',cid:pick(QUESTS)};
  else if(CURIOS[t])S.modal={type:'curio',cid:t};
  else{live().forEach(h=>{addStress(h,-6,true);if(h.hp>0)h.hp=Math.min(h.maxhp,h.hp+Math.round(h.maxhp*0.05))});finishRoom('고요한 방',['아무것도 없다. 잠시 숨을 고른다.','전원 스트레스 -6, 체력 소폭 회복'])}
  postOut();render()}
function finishRoom(title,lines,extra){if(S.pending&&S.pending.length){lines=lines.concat(S.pending);S.pending=[]}
  bury();if(!S.heroes.length){gameOver();return}advance();S.modal={type:'msg',title,lines,...(extra||{})};save()}
function postOut(){bury();if(!S.heroes.length)gameOver()}
function genStock(){const f=S.floor;const st=[];for(let i=0;i<3;i++)st.push({k:pick(SCROLL_KEYS),c:35+8*f});st.push({prov:'potion',c:28},{prov:'key',c:38});return st}
function genPrisoner(){const r=Math.random();if(r<0.55)return {kind:'hero',h:rollRecruit([30,42,18,8,2])};if(r<0.82)return {kind:'villain',tpl:pickEnemyTpl()};return {kind:'trap'}}
function chestLoot(lines,good){const dark=S.torch<30;const uqc=(good?0.08:0.035)+(dark?0.03:0);let uq=false;
  if(Math.random()<uqc){uq=true;addItem(makeUnique(),lines)}else addItem(lootItem(good?[5,25,40,23,7]:dark?[18,30,30,17,5]:[30,32,24,11,3]),lines);
  const g=Math.round(R(6,12)*S.floor*(dark?1.5:1));S.gold+=g;lines.push(`금화 +${g}`);if(Math.random()<0.25)addScroll(null,lines);if(Math.random()<0.03)addBook(R(0,3),lines);return uq}

/* ---------- enemies ---------- */
function scaleEnemy(b,f,x){x=x||0;const hm=GROW(1.40,1.255,f)+x,am=GROW(1.28,1.17,f)+x*0.6;const hp=Math.round(b.hp*hm);
  return {...b,uid:mkid(),el:b.randEl?pick(EL_ORDER):b.el,maxhp:hp,hp,atk:Math.round(b.atk*am),def:Math.round(b.def*Math.pow(1.12,f-1)),st:{},boss:false}}
const sortRanks=a=>a.sort((x,y)=>(x.rng?1:0)-(y.rng?1:0));
function pickEnemyTpl(){const th=theme();const pool=ENEMIES.filter(e=>e.th.includes(th.k));return Math.random()<0.8&&pool.length?pick(pool):pick(ENEMIES)}
function makeEnemies(x){const f=S.floor;const prog=S.map?S.map.step*0.03:0;return sortRanks(Array.from({length:R(2,4)},()=>applyForm(scaleEnemy(pickEnemyTpl(),f,(x||0)+prog),formRoll(f))))}
function makeElite(){return makeEnemies(0.45).map(e=>{e.n='정예 '+e.n;e.atk=Math.round(e.atk*1.15);return e})}
function makeMonster(){const f=S.floor;const b=pick(MONSTERS);const m=GROW(1.48,1.265,f),am=GROW(1.29,1.18,f);const hp=Math.round(b.hp*m);
  return [{...b,uid:mkid(),el:pick(EL_ORDER),maxhp:hp,hp,atk:Math.round(b.atk*am),def:Math.round(b.def*Math.pow(1.14,f-1)),spd:8,st:{},boss:true,mon:true,rng:1,acts:2,shifted:true}]}
function makeBoss(){const f=S.floor;const b=curBoss();const cyc=Math.floor((f-1)/4);const m=GROW(1.48,1.265,f),am=GROW(1.29,1.18,f);const hp=Math.round(b.hp*m);
  const pre=cyc&&!b.final?['각성한 ','고대의 ','심연의 '][Math.min(cyc,3)-1]:'';
  const boss={...b,phase:1,uid:mkid(),el:S.map&&S.map.bel||(b.randEl?pick(EL_ORDER):b.el),gim:S.map&&S.map.gim,n:pre+b.n,maxhp:hp,hp,atk:Math.round(b.atk*am),def:Math.round(b.def*Math.pow(1.14,f-1)),st:{},boss:true,rng:1,acts:(f>=3?2:1)+(S.map&&S.map.gim==='swift'?1:0),shifted:false};
  const k=f>=5?2:f>=2?1:0;const mins=[];for(let i=0;i<k;i++)mins.push(scaleEnemy(pickEnemyTpl(),f));
  return [...sortRanks(mins.filter(e=>!e.rng)),boss,...mins.filter(e=>e.rng)]}
function makeTraitor(h){const hp=Math.round(h.maxhp*2.4);return [{n:'타락한 '+h.nm,hero:JSON.parse(JSON.stringify(h)),uid:mkid(),el:h.el,maxhp:hp,hp,
  atk:Math.round(Math.max(h.atk,h.mag)*1.25),def:h.def,spd:h.spd,st:{},boss:true,rng:1,acts:2,shifted:true}]}

/* ---------- battle ---------- */
const U=uid=>S.heroes.find(h=>h.uid===uid)||(S.bench&&S.bench.find(h=>h.uid===uid))||(S.battle&&S.battle.en.find(e=>e.uid===uid));
const rankOf=u=>isH(u)?S.heroes.indexOf(u)+1:S.battle.en.indexOf(u)+1;
function startBattle(en,kind,ret){if(pact('hp'))en.forEach(e=>{e.maxhp=Math.round(e.maxhp*1.4);e.hp=e.maxhp});if(pact('atk'))en.forEach(e=>e.atk=Math.round(e.atk*1.3));if(pact('boss')&&kind==='boss')en.forEach(e=>{if(e.boss){e.maxhp=Math.round(e.maxhp*1.6);e.hp=e.maxhp;e.acts=(e.acts||1)+1}});try{S.heroes.forEach(fixSlots)}catch(e){}if(ngLv()){const K=ngK();en.forEach(e=>{e.maxhp=Math.round(e.maxhp*K);e.hp=e.maxhp;e.atk=Math.round(e.atk*Math.pow(K,0.9));e.def=Math.round(e.def*Math.pow(K,0.5))})}if(rule('gold'))en.forEach(e=>{e.maxhp=Math.round(e.maxhp*1.25);e.hp=e.maxhp});S.heroes.forEach(h=>{h.st={};h.cds={};h.en=tr(h,'godhand')?70:20;const u=ultOf(h);if(u&&!h.skills.includes(u))h.skills.push(u)});en.forEach(e=>e.en=0);
  S.battle={en,kind,ret:ret||'dungeon',roster:en.map(e=>({n:e.n,spr:e.spr,el:e.el,rng:e.rng,bkey:e.bkey,mon:e.mon})),queue:[],act:null,eact:null,sel:null,round:0,log:[],narr:'',insp:null,scrollRound:0};S.screen='battle';S.battle.bg=['boss','traitor'].includes(kind)?'throne':pick(BG_VAR[theme().k]||['base']);
  log({boss:`${(en.find(e=>e.bkey)||en[0]).n} 등장!`,monster:`${en[0].n}이 길을 막았다!`,elite:'매복이다! 정예 적들이 덮쳐온다.',normal:'어둠 속에서 무언가 움직인다…',traitor:`${en[0].n}이 검을 겨눈다`}[kind]);
  if(kind==='boss'){narr('boss');const b=en.find(e=>e.bkey)||en[0];S.intro={n:b.n,sub:b.final?`${FINAL}층 · 모든 어둠의 근원`:`${S.floor}층 · ${theme().n}의 주인`,spr:b.spr,el:b.el,k:'boss'};setTimeout(()=>{if(S.intro){S.intro=null;render()}},3400)}
  if(kind==='traitor')narr('traitor');
  if(kind==='monster'){narr('monster');S.intro={n:en[0].n,sub:'불운… 어둠 속에서 괴물이 깨어났다',spr:en[0].spr,el:en[0].el,k:'monster'};setTimeout(()=>{if(S.intro){S.intro=null;render()}},2800)}
  live().forEach(h=>{const v=qv(h,'battleStress')+(kind==='monster'?10:kind==='boss'||kind==='traitor'?6:0);if(v)addStress(h,v)});
  render();setTimeout(newRound,600)}
function newRound(){const B=S.battle;if(!B)return;B.round++;const q=[];if(B.round>1)S.torch=Math.max(0,S.torch-1);if(S.pet)petAct();if(lightLv()===0&&B.round>1)live().forEach(h=>addStress(h,2,true));
  live().forEach(h=>{if(tr(h,'timewarp'))gainEn(h,30);if(B.round>1&&h.hp>1&&(tr(h,'bloodpact')||hasCurse(h,'bleed'))){const v=Math.round(h.maxhp*(tr(h,'bloodpact')?0.07:0.04));h.hp=Math.max(1,h.hp-v);float(h,'-'+v,'dot')}if(B.round>1&&hasCurse(h,'mad'))addStress(h,4,true)});
  if(anyTr('lifeline'))live().forEach(h=>{if(h.hp===0){healHero(h,h.maxhp*0.35);float(h,'생명의 끈','heal')}});
  if(anyBt('ward'))live().forEach(h=>{const v=Math.round(h.maxhp*0.08);h.st.shield=(h.st.shield||0)+v});if(anyBt('roots'))live().forEach(h=>{if(h.hp>0&&h.hp<h.maxhp)healHero(h,h.maxhp*0.05)});
  if(B.round>8)B.en.forEach(e=>{if(e.hp>0){e.atk=Math.round(e.atk*1.2);if(B.round===9){float(e,'광폭화!','crit');log('너무 오래 끌었다… 적이 광폭화한다! (매 라운드 공격 +20%)')}}});
  live().forEach(h=>q.push({uid:h.uid,k:0,spd:h.spd+Math.random()*3}));
  B.en.forEach(e=>{if(e.hp>0){if(!e.it||!U(e.it.t)||U(e.it.t).dead)rollIntent(e);for(let k=0;k<(e.acts||1);k++)q.push({uid:e.uid,k,spd:e.spd+Math.random()*3-k*4})}});
  q.sort((a,b)=>b.spd-a.spd);B.queue=q;nextTurn()}
function cleanup(){const B=S.battle;B.en=B.en.filter(e=>e.hp>0);bury()}
function tick(u){const st=u.st;
  if(st.dot>0){const v=st.dotv||1;st.dot--;float(u,'-'+v,'dot');
    if(isH(u)){if(u.hp===0)deathRoll(u);else{u.hp=Math.max(0,u.hp-v);if(u.hp===0)enterDD(u)}}else{u.hp=Math.max(0,u.hp-v);if(u.hp===0)log(`${u.n} 쓰러졌다`)}}
  if(u.dead||(!isH(u)&&u.hp<=0))return;
  if(st.regen>0){st.regen--;if(isH(u))healHero(u,u.maxhp*0.08);else u.hp=Math.min(u.maxhp,u.hp+Math.round(u.maxhp*0.08))}
  if(isH(u)){if(u.fx.includes('regen')&&u.hp<u.maxhp)healHero(u,u.maxhp*0.07);
    if((u.vir&&u.vir.k==='steadfast')||u.fate==='saint'||u.fx.includes('holyset'))live().forEach(o=>addStress(o,-2,true))}
  if(!isH(u)&&st.broken>0)st.broken--;
  if(!isH(u)&&u.boss&&u.gim==='regen'&&u.hp>0){const v=Math.round(u.maxhp*0.06);u.hp=Math.min(u.maxhp,u.hp+v);float(u,'+'+v,'heal')}
  if(isH(u)&&bt(u,'ember'))S.battle&&S.battle.en.forEach(e=>{if(e.hp>0){e.st.dot=Math.max(e.st.dot||0,2);e.st.dotv=Math.max(e.st.dotv||0,Math.round(u.mag*0.3))}});
  if(isH(u)){const c=synv('calm');if(c)addStress(u,-c,true);const rg=synv('regen');if(rg&&u.hp>0&&u.hp<u.maxhp)healHero(u,u.maxhp*rg)}
  if(st.taunt>0)st.taunt--;if(st.rage>0)st.rage--;
  if(isH(u)){const n=u.fx.includes('cdr')?2:1;for(const k in u.cds)u.cds[k]=Math.max(0,u.cds[k]-n)}}
function nextTurn(){const B=S.battle;if(!B||S.screen!=='battle')return;if(S.modal||S.intro){setTimeout(nextTurn,300);return}
  cleanup();if(checkEnd())return;
  B.lunge=null;B.elunge=null;const t=B.queue.shift();if(!t){newRound();return}
  const u=U(t.uid);if(!u||u.dead||(!isH(u)&&u.hp<=0)){nextTurn();return}
  if(t.k===0)tick(u);
  if(u.dead||(!isH(u)&&u.hp<=0)){render();setTimeout(nextTurn,W(600));return}
  if(u.st.stun>0){u.st.stun--;log(`${un(u)} 기절해 움직이지 못한다`);float(u,'기절','sh');render();setTimeout(nextTurn,W(650));return}
  if(isH(u)){if(u.aff&&Math.random()<0.35&&actOut(u)){render();setTimeout(nextTurn,W(900));return}
    B.act=u.uid;B.sel=null;B.insp=null;render();if(S.auto)setTimeout(()=>autoAct(u.uid),W(500))}
  else{B.eact=u.uid;render();setTimeout(()=>enemyAct(u.uid),W(700))}}
function actOut(h){const k=h.aff.k;
  if(k==='fear'){log(`${h.nm}: "못 하겠어… 못 하겠다고!"`);float(h,'공포','big');return true}
  if(k==='selfish'){const i=S.heroes.indexOf(h);if(i<S.heroes.length-1){[S.heroes[i],S.heroes[i+1]]=[S.heroes[i+1],S.heroes[i]];log(`${h.nm}: "난 살아야겠어." 뒤로 물러났다`);float(h,'이기심','big');return true}return false}
  if(k==='paranoid'){const o=pick(live().filter(x=>x!==h));if(o){addStress(o,7);log(`${h.nm}: "너도 날 노리는 거지?"`)}return false}
  if(k==='hopeless'){live().forEach(o=>{if(o!==h)addStress(o,5)});log(`${h.nm}: "우린 여기서 다 죽을 거야…"`);return false}
  if(k==='frenzy'){const sid=h.skills.find(s=>SK[s].k==='dmg'&&canUse(h,s));if(!sid)return false;const sk=SK[sid];const ts=validTargets(sk);
    if(!ts.length)return false;log(`${h.nm}이 광분해 날뛴다!`);doSkill(h.uid,sid,sk.t==='enemy'?pick(ts).uid:null,true);return true}
  return false}
function calc(a,d,sk){let v=(sk.s==='mag'?a.mag:a.atk)*sk.p;if(a.st&&a.st.rage>0&&sk.s==='atk')v*=1.6;
  let em=emult(atkEl(a),d.el);if(rule('storm'))em=em>1?3:em<1?0.35:1;if(isH(a)&&tr(a,'elemaster'))em=em>1?3:Math.max(1,em);v*=em*(0.9+Math.random()*0.2);let cc=0.08+(sk.crit||0)+(a.crit||0);let cm=1.5;
  if(isH(a)){if(lightLv()===3)cc+=0.05;if(a.st&&a.st.bl)v*=1+0.1*a.st.bl;if(S.pet&&S.pet.k==='cat')cc+=0.05;if(tr(a,'berserk'))v*=1+1.2*(1-a.hp/a.maxhp);if(anyTr('aura'))v*=1.15;if(sk.ult){if(tr(a,'exec'))v*=2.5;if(tr(a,'godhand'))v*=4}if(tr(a,'precise'))cm=3;if(anyBt('seer'))cc+=0.1;if(bt(a,'blood')&&d.hp<d.maxhp*0.5)v*=1.6;if(bt(a,'prism')){if(sk.s==='mag')v*=1.3;if(em>1)cc+=0.25}v*=1+synv('dmg')+(sk.s==='mag'?synv('mdmg'):0);const re=resoEl(live());if(re&&atkEl(a)===re)v*=1+synv('elem');cc+=synv('crit');if(em>1)cc+=0.2+synv('weakCrit')}
  else{if(rule('bloodmoon'))v*=1.15}

function petSVG(k,st){const key='pet|'+k+'|'+st;if(VCACHE[key])return VCACHE[key];const v=V(key);const {G,glow}=v;const o='stroke="#120a0c" stroke-width="1.6" stroke-linejoin="round"';let s='';const c=PETS[k].c;

  else s=`<path d="M30 30 Q14 10 4 18 Q10 22 8 28 Q16 26 20 34Z M34 30 Q50 10 58 18 Q52 22 54 28 Q46 26 42 34Z" fill="${G('#a02a1a')}" ${o}/><path d="M14 48 Q8 54 4 50" stroke="#c03a1a" stroke-width="3" fill="none"/><ellipse cx="30" cy="40" rx="13" ry="10" fill="${G('#d0402a')}" ${o}/><path d="M20 26 Q20 14 32 14 Q44 16 44 26 Q42 34 32 34 Q22 34 20 26Z" fill="${G('#e04a2a')}" ${o}/><path d="M24 16 L20 6 L28 13Z M38 15 L44 6 L40 16Z" fill="${G('#f2ead8')}" ${o}/>`+eye(28,24,2,'#ffe27a')+eye(37,24,2,'#ffe27a')+glow(`<path d="M44 28 Q50 28 54 26" stroke="#ffb03a" stroke-width="2" fill="none"/>`,'#ff6a1a');
  const sc=[0.8,1,1.2][st];const crown=st>=2?`<path d="M24 8 L26 2 L29 6 L32 0 L35 6 L38 2 L40 8Z" fill="${G('#f2c95a')}" ${o}/>`:'';
  const out=`<svg class="petsvg" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><defs>${v.defs()}</defs>${st>=1?glow(`<ellipse cx="30" cy="54" rx="${16+st*4}" ry="3" fill="${c}" opacity=".4"/>`,c):''}<g transform="translate(30 56) scale(${sc}) translate(-30 -56)">${s}${crown}</g></svg>`;VCACHE[key]=out;return out}
function rollPet(rare){const ks=Object.keys(PETS);return ks[rollGrade(ks.map(k=>PETS[k].w*(rare&&PETS[k].w<15?3:1)))]}
function giveEgg(L,rare){if(S.egg){L&&L.push('알을 더 들 수 없다. (이미 알이 있다)');return}S.egg={left:4,rare:!!rare};L&&L.push(`<b style="color:#ffd86a">🥚 ${rare?'빛나는 ':''}알</b>을 얻었다! 전투 4번 뒤 부화한다`)}
function petAct(){const p=S.pet;const B=S.battle;if(!p||!B)return;const en=B.en.filter(e=>e.hp>0);const al=live();if(!al.length)return;const pw=petPow(p);const low=al.reduce((a,b)=>a.hp/a.maxhp<b.hp/b.maxhp?a:b);
  const hit=(e,v)=>applyDmg(e,{d:Math.max(1,Math.round(v-e.def*0.3)),crit:false,em:1});
  try{if(p.k==='bat'&&en.length){const e=pick(en);const d=hit(e,pw);healHero(low,d*0.5);fxHit(e.uid,'claw','#c08aff',0)}
  else if(p.k==='sala'){en.forEach(e=>{hit(e,pw*0.3);e.st.dot=Math.max(e.st.dot||0,2);e.st.dotv=Math.max(e.st.dotv||0,Math.round(pw*0.4));fxHit(e.uid,'blast','#ff7a2a',0)})}
  else if(p.k==='fairy'){healHero(low,pw*1.2);fxHit(low.uid,'heal','#9aff8a',0)}
  else if(p.k==='turtle'){al.forEach(h=>{const v=Math.round(pw*0.6);h.st.shield=(h.st.shield||0)+v;fxHit(h.uid,'shield','#a0c8a0',0)})}
  else if(p.k==='cat'&&en.length&&Math.random()<0.5){const e=pick(en);hit(e,pw*0.7);fxHit(e.uid,'claw','#ffd86a',0)}
  else if(p.k==='tent'&&en.length){const e=pick(en);hit(e,pw*0.8);if(e.hp>0&&Math.random()<0.3){e.st.stun=1;float(e,'기절','sh')}fxHit(e.uid,'claw','#c060ff',0)}
  else if(p.k==='dragon'){en.forEach(e=>{hit(e,pw*1.2);e.st.dot=Math.max(e.st.dot||0,3);e.st.dotv=Math.max(e.st.dotv||0,Math.round(pw*0.5));fxHit(e.uid,'meteor','#ff6a1a',0)})}}catch(e){}
  log(`🐾 ${PETS[p.k].n}의 차례`)}
function petVictory(L){if(S.pet){const p=S.pet;const lv0=petLv(p),st0=petSt(p);p.xp=(p.xp||0)+1;if(petLv(p)>lv0)L.push(`🐾 ${PETS[p.k].n} Lv.${petLv(p)}${petSt(p)>st0?' · <b style="color:#ffd86a">성장했다!</b>':''}`)}
  if(S.egg){S.egg.left--;if(S.egg.left<=0){const k=rollPet(S.egg.rare);S.egg=null;if(S.pet&&S.pet.k!==k){S.petOffer=k;L.push(`🥚 알이 부화했다! <b>${PETS[k].n}</b> — 지금 펫과 바꿀지는 여관에서 고를 수 있다`)}else{S.pet={k,xp:0};L.push(`🥚 알이 부화했다! <b style="color:${PETS[k].c}">${PETS[k].n}</b>${k==='dragon'?' · 신화!!':''}`);if(k==='dragon'||k==='tent')try{setTimeout(()=>fxJackpot('희귀 펫!!',PETS[k].n),60)}catch(e){}}}else L.push(`🥚 알이 꿈틀거린다… (${S.egg.left}번 남음)`)}}
function petBox(){const p=S.pet;if(!p&&!S.egg)return '';return `<div class="petbox">${p?`${petSVG(p.k,petSt(p))}<small>${PETS[p.k].n} Lv.${petLv(p)}</small>`:`<div class="egg">🥚</div><small>${S.egg.left}전투 후 부화</small>`}</div>`}

const fuseCost=()=>30*S.floor;
function vFusion(){const sel=S.fuseSel||[];return `${pageHead('영웅 합성','두 영웅을 바쳐 하나의 새 영웅을 만든다')}
 <div class="card sm">두 영웅을 고르면 하나로 합쳐진다. 대박이면 <b style="color:#ff5ab0">신화</b>, 쪽박이면 <b style="color:#ff4a5a">저주받은 영웅</b>, 아주 드물게 <b style="color:#c060ff">괴물</b>이 태어난다. 장비는 가방으로 돌아온다.</div>
 <div class="list">${S.heroes.concat(S.bench||[]).filter(h=>!h.dead).map(h=>`<button class="item${sel.includes(h.uid)?' uq':''}" style="--gc:${sel.includes(h.uid)?'#ff9ad8':'var(--line)'}" data-a="fuseSel" data-v="${h.uid}"><div class="art px" style="width:42px">${heroSpriteImg(h)}</div><div><div class="in">${h.nm} ${sel.includes(h.uid)?'✔':''}</div><div class="is">${hname(h)} · Lv.${h.lv} · ${RAR[h.rar]?RAR[h.rar].n:''}</div></div></button>`).join('')}</div>
 <p class="sm muted">확률 · 신화 7% · 대박 18% · 보통 52% · 쪽박 18% · 괴물 5%</p>
 <button class="btn gold big" style="width:100%" data-a="fuse" ${sel.length===2&&S.gold>=fuseCost()?'':'disabled'}>🧬 합성 · 금화 ${fuseCost()}</button>`}
function doFusion(){const [a,b]=(S.fuseSel||[]).map(U);if(!a||!b||S.gold<fuseCost())return;if(S.heroes.filter(h=>h!==a&&h!==b).length===0&&!(S.bench||[]).some(h=>h!==a&&h!==b)&&false)return;S.gold-=fuseCost();
  [a,b].forEach(h=>Object.values(h.eq).forEach(it=>{if(it)S.inv.push(it)}));S.heroes=S.heroes.filter(h=>h!==a&&h!==b);S.bench=(S.bench||[]).filter(h=>h!==a&&h!==b);S.fuseSel=[];
  const r=Math.random();let title,L=[],h,jack=0;const lv=Math.max(a.lv,b.lv)+2,tier=Math.max(a.tier||0,b.tier||0);
  const trs=[...new Set([...(a.tr||[]),...(b.tr||[])])].filter(k=>TRAITS[k]&&TRAITS[k].r<4).sort((x,y)=>TRAITS[y].r-TRAITS[x].r);
  const base=(rar)=>{const cls=Math.random()<0.3?pick(CLS_ORDER):pick([a.cls,b.cls].filter(c=>CLASSES[c]).concat(['knight']).slice(0,2));const x=newHero(cls,pick([a.el,b.el]),lv,rar);x.race=pick([a.race,b.race].filter(Boolean).concat(['human']));x.tier=tier;x.tr=trs.slice(0,2);return x};
  if(r<0.05){const tpl=pick(ENEMIES);h=newVillain(tpl,lv,1.6);h.tier=tier;title='괴물 탄생?!';L.push(`두 영혼이 뒤엉켜 <b>${tpl.n}</b>의 모습으로 태어났다!`)}
  else if(r<0.12){h=base(5);const lg=pick(['godhand','timewarp','immortal','avatar','phoenix']);if(!h.tr.includes(lg))h.tr.push(lg);title='신화 탄생!!';jack=1;L.push(`<b style="color:#ff5ab0">신화 등급</b>의 영웅이 태어났다! [전설] ${TRAITS[lg].n}`)}
  else if(r<0.30){h=base(4);title='합성 대박!';jack=1;L.push('<b style="color:#f2a53a">전설 등급</b> 영웅이 태어났다!')}
  else if(r<0.82){h=base(Math.min(5,Math.max(a.rar||1,b.rar||1)+(Math.random()<0.3?1:0)));title='합성 성공';L.push('두 영웅의 힘이 하나가 되었다.')}
  else{h=base(0);const k=pick(['bloodpact','madness','frail']);h.tr=[k];h.stress=60;title='합성 실패…';jack=-1;L.push(`뒤틀린 존재가 태어났다… [저주] ${TRAITS[k].n}`)}
  recalc(h,true);h.hp=h.maxhp;addHero(h);L.unshift(`${a.nm} + ${b.nm} → <b>${h.nm}</b> (${hname(h)})`);if(h.tr&&h.tr.length&&jack>=0)L.push('계승 특성: '+h.tr.map(k=>TRAITS[k].n).join(', '));
  S.page=null;S.modal={type:'msg',title,lines:L,spr:h.uid,uq:jack>0,warn:jack<0};save();render();try{if(jack>0)fxJackpot(title,h.nm);else if(jack<0)fxBust(title,'')}catch(e){}}

const reforgeCost=it=>({m:2+it.g*2,g:15*S.floor*(1+it.g)});
function doReforge(id){const f=findItem(+id);if(!f)return;const it=f.it;const c=reforgeCost(it);if((S.mats||0)<c.m||S.gold<c.g)return;S.mats-=c.m;S.gold-=c.g;const r=Math.random();let title,L=[],jack=0;
  const roll=(lo,hi)=>{const st={};for(const k in it.base||it.st){const v=(it.base||it.st)[k];st[k]=['atk','mag','def','hp'].includes(k)?Math.max(1,Math.round(v*(lo+Math.random()*(hi-lo)))):v}it.base=st;applyUp(it)};
  if(r<0.10){if(f.h)f.h.eq[it.slot]=null;else S.inv=S.inv.filter(x=>x!==it);title='장비 파괴…';jack=-1;L.push(`${itemTag(it)}이 산산조각 났다!`)}
  else if(r<0.28){title='재련 실패';L.push('불꽃이 꺼졌다. 아무 일도 일어나지 않았다.')}
  else if(r<0.45&&it.g<4&&!it.set){const nw=makeItem(it.g+1,it.slot,it.cls);nw.up=it.up||0;nw.wel=it.wel;applyUp(nw);if(f.h){f.h.eq[it.slot]=nw;recalc(f.h)}else{S.inv=S.inv.filter(x=>x!==it);S.inv.push(nw)}title='재련 대박!!';jack=1;L.push(`등급이 올랐다! ${itemTag(nw)}`);if(f.h)recalc(f.h);S.modal={type:'msg',title,lines:L,uq:true};save();render();try{fxJackpot('등급 상승!!',nw.n)}catch(e){}return}
  else{roll(0.85,1.45);if(Math.random()<0.25&&it.slot==='w'&&!it.wel){it.wel=pick(EL_ORDER);it.bn=ELI[it.wel]+' '+it.bn;applyUp(it);L.push(`${EL[it.wel].n} 속성이 깃들었다!`)}title='재련 완료';L.push(`${itemTag(it)} · ${statText(it.st)}`)}
  if(f.h)recalc(f.h);S.modal={type:'msg',title,lines:L,warn:jack<0};save();render();try{if(jack<0)fxBust('파괴…',it.n)}catch(e){}}

(function(){
 try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
 // silent looping <audio> puts iOS into "playback" category so Web Audio ignores the mute switch
 let tag=null;const mkTag=()=>{if(tag)return tag;try{const sr=8000,n=sr/2,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);const w=(o,str)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);

 const unlock=()=>{try{
   if(MU.on||musPref()!=='off'){const t=mkTag();if(t&&t.paused){const p=t.play();if(p&&p.catch)p.catch(()=>{})}}
   const C=MU.ctx;if(C){if(C.state!=='running')C.resume();const b=C.createBuffer(1,1,22050),src=C.createBufferSource();src.buffer=b;src.connect(C.destination);src.start(0)}

 }catch(e){}};
 try{['touchend','pointerup','click','keydown'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true,capture:true}));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(unlock,50)})}catch(e){}

 enh(id){return doEnh(id);const f=findItem(+id);if(!f)return;const it=f.it;const up=it.up||0;if(up>=maxUp())return;const c=enhCost(it);if((S.mats||0)<c.m||S.gold<c.g)return;
   S.mats-=c.m;S.gold-=c.g;if(!it.base)applyUp(it);const ok=Math.random()<ENH[up];let down=false;if(ok)it.up=up+1;else if(up>=5){it.up=up-1;down=true}applyUp(it);if(f.h)recalc(f.h);

 salv(id){const it=S.inv.find(x=>x.id===+id);if(!it)return;S.mats=(S.mats||0)+matOf(it);S.inv=S.inv.filter(x=>x!==it);S.modal=null;save();render()},
 salvAll(){if(!S.inv.length)return;let m=0;S.inv.forEach(it=>m+=matOf(it));const n=S.inv.length;S.inv=[];S.mats=(S.mats||0)+m;S.modal={type:'msg',title:'분해 완료',lines:[`안 쓰는 장비 ${n}개를 분해했다.`,`마석 +${m} (가진 마석 ${S.mats})`,'마석은 장비를 눌러 강화할 때 쓴다.']};save();render()},
 sellJunk(){S.inv.filter(x=>x.g===0&&!x.set).forEach(x=>S.gold+=x.val);S.inv=S.inv.filter(x=>x.g>0||x.set);save();render()},
 transform(v){const [bi,u]=v.split('|');const h=U(u);const b=BOOKS[+bi];if(S.books[+bi]<4||!h)return;const B=BOSSCLS[b.k];
   S.books[+bi]-=4;const old=hname(h);h.boss=b.k;h.el=B.el;h.skills=B.skills.slice();h.cds={};S.evoQ=S.evoQ.filter(x=>x!==h.uid);recalc(h);if(h.hp>0)h.hp=h.maxhp;
   S.modal={type:'msg',title:'금지된 변신',uq:true,spr:h.uid,lines:[`${h.nm}(${old})이 마도서 4권을 읽었다…`,`<b style="color:var(--g5)">${B.n}</b>(으)로 다시 태어났다!`,'보스의 힘: 기본 능력치 ×1.6',BTRAIT[b.k]?`<b style="color:#ffb8e6">고유 특성 · ${BTRAIT[b.k].n}</b> — ${BTRAIT[b.k].d}`:'',SK['bu_'+b.k]?`<b style="color:#ffd86a">고유 필살기 · ${SK['bu_'+b.k].n}</b> — ${SK['bu_'+b.k].d.replace('필살기 · ','')}`:'']};save();render()},
 rest(v){const I=S.inn;if(I.rest)return;if(v==='room'){if(S.gold<roomCost())return;S.gold-=roomCost()}I.rest=true;
   live().forEach(h=>{h.dd=false;h.hp=v==='room'?h.maxhp:Math.min(h.maxhp,Math.max(1,h.hp)+Math.round(h.maxhp*0.3))});S.modal={type:'msg',title:v==='room'?'푹신한 침대':'건초 더미',lines:[v==='room'?'체력이 모두 회복됐다.':'체력이 30% 회복됐다.']};save();render()},
 drink(){const I=S.inn;if(I.drink||S.gold<drinkCost())return;S.gold-=drinkCost();I.drink=true;live().forEach(h=>{h.stress=Math.max(0,h.stress-45);if(h.stress<100)h.aff=null});
   const L=['술잔이 오갔다. 전원 스트레스 -45'];const r=Math.random();if(r<0.15){const g=Math.round(S.gold*0.15);S.gold-=g;L.push(`${rh().nm}이 술값을 날렸다… 금화 -${g}`)}else if(r<0.25){addScroll(null,L);L.push('취한 마법사가 두루마리를 놓고 갔다')}

 pray(){const I=S.inn;if(I.pray||S.gold<prayCost())return;S.gold-=prayCost();I.pray=true;live().forEach(h=>{h.stress=Math.max(0,h.stress-28);h.ali=clamp(h.ali+5,-100,100);if(h.stress<100)h.aff=null});

 roll(){if(!canAdd()||S.gold<recruitCost())return;S.gold-=recruitCost();const h=rollRecruit();const w=addHero(h);if(w==='party')queueEvo(h);S.modal={type:'recruit',uid:h.uid};save();render()},
 dismiss(u){const I=S.inn;if(!I||S.heroes.length<=1)return;if(I.dis!==u){I.dis=u;render();return}const h=U(u);Object.values(h.eq).forEach(it=>{if(it)addItem(it)});S.heroes=S.heroes.filter(x=>x!==h);I.dis=null;S.page={n:'inn-roster'};save();render()},
 ibuy(i){const it=S.inn.stock[+i];if(!it||it.sold||S.gold<scrollCost())return;S.gold-=scrollCost();it.sold=true;addScroll(it.k);save();render()},
 gamble(k){const b=BOXES[+k];const c=b.c(S.floor);if(S.gold<c)return;S.gold-=c;

   else{const it=(+k===2&&Math.random()<0.03)?makeUnique():lootItem(b.w);const kept=addItem(it);S.modal={type:'gamble',k:+k,item:it,sold:!kept}}save();render()},
 buy(k){const s=SHOP.find(x=>x.k===k);if(!s||S.gold<s.c)return;S.gold-=s.c;S.prov[k]++;save();render()},
 descend(){live().forEach(h=>{h.vir=null;if(h.stress<100)h.aff=null});genFloor();S.screen='dungeon';S.inn=null;S.page=null;checkHidden();try{runQuests()}catch(e){}save();render()},
 restart(){const setup=S.setup,best=S.best;S=fresh();S.setup=setup;S.best=Math.max(best,loadBest());render()}
};
